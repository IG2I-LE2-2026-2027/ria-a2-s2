function boucle(iPeriode,fnCbTraitement,fnCbContinuer) {
	// Objectif : déclencher un appel à la fonction fnCbTraitement
	// toutes les iPeriode secondes, 
	// tant que fnCbContinuer renvoie vrai
	
	var foo = function() {
		// le scope de la fonction foo
		// contient les var. locales de boucle 
		// => il n'est plus nécessaire de les sauvegarder 
		// en var. globales 
		if (	(fnCbContinuer==undefined) || fnCbContinuer()) {
			fnCbTraitement(); 
			window.setTimeout(foo,iPeriode*1000);
		}
	}
	foo();

	// fnCbTraitement est une fonction de rappel ("CALLBACK")
	// elle sera appelée plus tard
	// pour l'appeler, il suffit d'ajouter les parenthèses !

	// rendre le 3ème argument optionnel

}

var oDefault = {
	periode : 5, 
	traiter: function(){trace("traitement boucle");}, 
	poursuivre: function(){return true;}
} 

// fonction enrichir(oDefaut,oModif) qui renvoie un nouvel objet en ayant complété les propriétés absentes de l’objet de configuration par les valeurs de l’objet par défaut.

function enrichir(oDefault,oModif) {
	var res = {}; 
	for (prop in oDefault) {
		if (oModif[prop] != undefined) res[prop] = oModif[prop]; 
		else res[prop] = oDefault[prop];
	}
	return res; 
}

function boucleV2(oConfig) {
	// 1) Gestion des arguments :

	// SOLUTION : demander à réaliser un clonage

	// var monNouvelObjet = JSON.parse(JSON.stringify(monObjet)); 
	// Pb : ne marche pas pour les fonctions 
	
	/*
	var oParams = oDefault; // Ceci est une prise de référence !!!
	// PAS un clonage, PAS une duplication
	// oParams est un nouveau nom pour oDefault
	// les deux représentent le même espace mémoire !!  
	
	if (oConfig.periode != undefined) oParams.periode = oConfig.periode;
	if (oConfig.traiter != undefined) oParams.traiter = oConfig.traiter;
	if (oConfig.poursuivre != undefined) oParams.poursuivre = oConfig.poursuivre;
	*/
	
	var oParams = enrichir(oDefault,oConfig);
	// 2) exécuter le traitement prévu 
	
	var foo = function() {
		if (oParams.poursuivre()) {
			oParams.traiter(); 
			window.setTimeout(foo,oParams.periode*1000);
		}
	}
	foo();
}
